<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5" />

  <!-- API Icon -->
  <circle cx="30" cy="50" r="20" fill="#4CAF50" />
  <text x="30" y="55" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" dominant-baseline="central">API</text>

  <!-- REST Text -->
  <text x="80" y="50" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="start" dominant-baseline="central">REST</text>
  
  <!-- Underline -->
  <line x1="80" y1="60" x2="180" y2="60" stroke="#333" stroke-width="2" />

  <!-- Tagline -->
